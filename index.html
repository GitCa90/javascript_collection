<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="styles.css" />
        <title>Javascript Collection</title>
    </head>
    <body>
        <h1 id="header">Javascript Collection</h1>
        <section id="main-wrapper">
            <aside id="category">
                <div id="category_games" class="cat" data-category="games">Games</div>
                <div class="cat" data-category="tools">Tools</div>
                <div id="category_algorithms" class="cat" data-category="algorithms">
                    Algorithms
                </div>
            </aside>
            <main id="projects"></main>
            <section id="detail_panel">
                <section id="detail_info" class="hidden">
                    <section id="detail_top_section">
                        <h2 id="detail_header"></h2>
                        <img src="" alt="" id="detail_bgimg" />
                    </section>
                    <p id="detail_description"></p>
                    <div id="detail_enterButton" class="hidden">Enter ▶</div>
                </section>

                <iframe id="detail_embed" src="" frameborder="0"></iframe>
            </section>
        </section>

        <script src="main.js"></script>
    </body>
</html>
